<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reclamo recibido — Sanservi</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="estilos.css">
</head>
<body style="background: #F5F7FA;">
  <main style="min-height: 100vh; display: grid; place-items: center; padding: 24px;">
    <section style="max-width: 620px; background: #fff; padding: 48px 36px; border-radius: 18px; text-align: center; box-shadow: 0 10px 30px rgba(13,43,78,0.08);">
      <h1 style="color: #0D2B4E; font-size: 2rem; margin-bottom: 12px;">Tu reclamo fue recibido</h1>
      <p style="color: #4A5568; margin-bottom: 18px;">Gracias por compartir tus datos. Tu referencia es:</p>
      <p id="ref" style="font-weight: 700; color: #00C4A1; font-size: 1.1rem;"></p>
      <a href="index.html" class="btn btn-primario">Volver al inicio</a>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if (ref) {
      document.getElementById('ref').textContent = ref;
    }
  </script>
</body>
</html>
